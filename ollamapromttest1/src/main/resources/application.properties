# The default port for Ollama is 11434
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:1b
spring.ai.ollama.chat.options.timeout=300000
server.port=8090

# Enable detailed logs for the Ollama integration
logging.level.org.springframework.ai.ollama=DEBUG

# Enable logging for the ChatClient and advisors (useful for seeing final prompts)
logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=DEBUG

# Optional: If you want to see the underlying HTTP traffic (RestTemplate/WebClient)
logging.level.org.springframework.web.client.RestTemplate=DEBUG
logging.level.org.apache.hc.client5.http.wire=DEBUG
# Allow Spring to include the actual prompt text in logs/metrics
spring.ai.chat.client.observations.include-input=true

# Log the response coming back from the vector store (Qdrant)
spring.ai.vectorstore.observations.log-query-response=true